name: Release (manual)

# Manual only. Run window offers:
#   * build_llvm22 / build_llvm23 — 复选框，选要编哪些 LLVM 大版本
#   * platforms — 平台 JSON（每次运行可改）：
#       仅手机arm64 : [{"os":"linux-aarch64","runner":"ubuntu-24.04-arm"}]
#       arm64+电脑 : 再加 {"os":"linux-x64","runner":"ubuntu-24.04"}
#       全平台     : 再加 {"os":"windows","runner":"windows-2022"}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如 v0.1.0)'
        required: true
      llvm22_ref:
        description: 'LLVM 22 分支或 tag'
        required: true
        default: 'release/22.x'
      llvm23_ref:
        description: 'LLVM 23 分支或 tag'
        required: true
        default: 'release/23.x'
      build_llvm22:
        description: '编译 LLVM 22'
        type: boolean
        default: false
      build_llvm23:
        description: '编译 LLVM 23'
        type: boolean
        default: true
      build_android:
        description: '编译 Termux 安卓原生版（aarch64）'
        type: boolean
        default: true
      platforms:
        description: '平台列表 JSON（必须英文半角引号）'
        required: true
        default: '[{"os":"linux-aarch64","runner":"ubuntu-24.04-arm"}]'

jobs:
  build22:
    if: ${{ inputs.build_llvm22 }}
    uses: ./.github/workflows/build.yml
    with:
      llvm_major: '22'
      llvm_ref: ${{ inputs.llvm22_ref }}
      matrix_include: ${{ inputs.platforms }}

  build23:
    if: ${{ inputs.build_llvm23 }}
    uses: ./.github/workflows/build.yml
    with:
      llvm_major: '23'
      llvm_ref: ${{ inputs.llvm23_ref }}
      matrix_include: ${{ inputs.platforms }}

  build-android22:
    if: ${{ inputs.build_android && inputs.build_llvm22 }}
    uses: ./.github/workflows/build-android.yml
    with:
      llvm_major: '22'
      llvm_ref: ${{ inputs.llvm22_ref }}

  build-android23:
    if: ${{ inputs.build_android && inputs.build_llvm23 }}
    uses: ./.github/workflows/build-android.yml
    with:
      llvm_major: '23'
      llvm_ref: ${{ inputs.llvm23_ref }}

  release:
    name: Draft release
    needs: [build22, build23, build-android22, build-android23]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: artifacts/*
          draft: true
          prerelease: ${{ contains(inputs.tag, '-rc') || contains(inputs.tag, '-beta') }}
          body: |
            ## xollvm — ${{ inputs.tag }}

            ### Artifacts
            | File | What | Host | LLVM |
            |---|---|---|---|
            | `xollvm-linux-aarch64-llvm*-Release.tar.zst` | 混淆版 clang/opt | Linux aarch64（手机 proot 用） | * |
            | `xollvm-android-aarch64-llvm*-Release.tar.zst` | 混淆版 clang/opt | **Android bionic（Termux 裸跑）** | * |
            | `xollvm-linux-x64-llvm*-Release.tar.zst` | 混淆版 clang/opt | Linux x86_64（电脑） | * |
            | `xollvm-windows-llvm*-Release.7z` | 混淆版 clang/opt | Windows x64 | * |

            ### Cross-compilation targets
            Linux 版: X86;AArch64;ARM;RISCV。Android 版: AArch64;ARM。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
