name: Build Android (reusable)

# 交叉编译 host=aarch64-linux-android 的 bionic 编译器
# 产物在 Android 手机 Termux 里裸跑（libc++ 静态链接，无外部依赖）
on:
  workflow_call:
    inputs:
      llvm_major:
        required: true
        type: string
      llvm_ref:
        required: true
        type: string
  # 允许单独手动跑（调试用，不用等整条 release 链路）
  workflow_dispatch:
    inputs:
      llvm_major:
        description: 'LLVM 大版本号（如 23）'
        required: true
        default: '23'
      llvm_ref:
        description: 'LLVM 分支或 tag'
        required: true
        default: 'release/23.x'

jobs:
  toolchain-android:
    name: android-aarch64 / llvm${{ inputs.llvm_major }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      # linux-arm64 NDK（musl 静态版，社区构建，永久链接）
            NDK_URL: 'https://github.com/HomuHomu833/android-ndk-custom/releases/download/r29/android-ndk-r29-aarch64-linux-musl.tar.xz'
    steps:
      - name: 拉取 xollvm 源码
        uses: actions/checkout@v4
        with:
          path: xollvm
          fetch-depth: 1

      - name: 拉取 LLVM 官方源码
        run: git clone --depth 1 --branch "${{ inputs.llvm_ref }}" https://github.com/llvm/llvm-project llvm-src
        shell: bash

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean && df -h

      - name: 安装依赖并下载 NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache python3 zstd file curl
          mkdir -p "$HOME/ndk"
          echo "下载地址: $NDK_URL"
          curl -fL --retry 3 --connect-timeout 30 \
            -o "$HOME/ndk/ndk.archive" "$NDK_URL"
          ls -lh "$HOME/ndk/ndk.archive"
          cd "$HOME/ndk"
          case "$(file -b ndk.archive | cut -d, -f1)" in
            *Zip*) unzip -q ndk.archive ;;
            *XZ*|*"gzip"*) tar -xf ndk.archive ;;
            *) echo "无法识别的压缩格式:"; file ndk.archive; exit 1 ;;
          esac
          ls "$HOME/ndk"

      - name: 配置（宿主 = aarch64-linux-android）
        shell: bash
        run: |
          NDK=$(ls -d "$HOME/ndk"/android-ndk-* | head -n1)
          TC=$(ls -d "$NDK"/toolchains/llvm/prebuilt/*/ | head -n1)
          echo "NDK: $NDK"
          echo "工具链目录: $TC"
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android \
            -DCMAKE_SYSROOT="$TC/sysroot" \
            -DCMAKE_C_COMPILER="$TC/bin/clang" \
            -DCMAKE_CXX_COMPILER="$TC/bin/clang++" \
            -DCMAKE_C_FLAGS="--target=aarch64-linux-android24" \
            -DCMAKE_CXX_FLAGS="--target=aarch64-linux-android24 -static-libstdc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-pie" \
            -DLLVM_ENABLE_PROJECTS="llvm;clang" \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_EH=ON \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM" \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DLLVM_DISTRIBUTION_COMPONENTS="clang;clang-resource-headers;opt" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_EXTERNAL_PROJECTS=Obfuscator \
            -DLLVM_EXTERNAL_OBFUSCATOR_SOURCE_DIR="$GITHUB_WORKSPACE/xollvm" \
            -DLLVM_OBFUSCATOR_LINK_INTO_TOOLS=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            ../llvm-src/llvm

      - name: 编译
        run: cmake --build build --parallel 4 --target install-distribution

      - name: 验证产物（交叉编译无法本机执行，只验 ELF 身份）
        run: |
          file install/bin/clang
          readelf -h install/bin/clang | grep -E "Class|Machine|interpreter" || true
          # 期望看到: ELF 64-bit / ARM aarch64 / interpreter /system/bin/linker64

      - name: 打包
        run: |
          cd install
          tar --zstd -cf ../xollvm-android-aarch64-llvm${{ inputs.llvm_major }}-Release.tar.zst .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: xollvm-android-aarch64-llvm${{ inputs.llvm_major }}
          path: xollvm-android-aarch64-llvm${{ inputs.llvm_major }}-Release.tar.zst
          retention-days: 14
          if-no-files-found: error
