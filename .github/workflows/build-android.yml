name: Build Android (reusable)

# 交叉编译 host=aarch64-linux-android 的 bionic 编译器
# 产物在 Android 手机 Termux 里裸跑（libc++ 静态链接，无外部依赖）
on:
  workflow_call:
    inputs:
      llvm_major:
        required: true
        type: string
      llvm_ref:
        required: true
        type: string
  # 允许单独手动跑（调试用，不用等整条 release 链路）
  workflow_dispatch:
    inputs:
      llvm_major:
        description: 'LLVM 大版本号（如 23）'
        required: true
        default: '23'
      llvm_ref:
        description: 'LLVM 分支或 tag'
        required: true
        default: 'release/23.x'

jobs:
  toolchain-android:
    name: android-aarch64 / llvm${{ inputs.llvm_major }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      # linux-arm64 NDK（musl 静态版，社区构建，永久链接）
            NDK_URL: 'https://github.com/HomuHomu833/android-ndk-custom/releases/download/r29/android-ndk-r29-aarch64-linux-musl.tar.xz'
    steps:
      - name: 拉取 xollvm 源码
        uses: actions/checkout@v4
        with:
          path: xollvm
          fetch-depth: 1

      - name: 拉取 LLVM 官方源码
        run: git clone --depth 1 --branch "${{ inputs.llvm_ref }}" https://github.com/llvm/llvm-project llvm-src
        shell: bash

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean && df -h

      - name: 安装依赖并下载 NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache python3 zstd file curl
          mkdir -p "$HOME/ndk"
          echo "下载地址: $NDK_URL"
          curl -fL --retry 3 --connect-timeout 30 \
            -o "$HOME/ndk/ndk.archive" "$NDK_URL"
          ls -lh "$HOME/ndk/ndk.archive"
          cd "$HOME/ndk"
          case "$(file -b ndk.archive | cut -d, -f1)" in
            *Zip*) unzip -q ndk.archive ;;
            *XZ*|*"gzip"*) tar -xf ndk.archive ;;
            *) echo "无法识别的压缩格式:"; file ndk.archive; exit 1 ;;
          esac
          ls "$HOME/ndk"

      - name: 配置（宿主 = aarch64-linux-android）
        shell: bash
        run: |
          NDK=$(ls -d "$HOME/ndk"/android-ndk-* | head -n1)
          PB="$NDK/toolchains/llvm/prebuilt"
          REAL=$(ls -d "$PB"/*/ | head -n1)
          echo "NDK: $NDK"
          echo "真实工具链目录: $REAL"

          # 给 x86 宿主名建软链，指向真实 arm64 目录
          cd "$PB"
          ln -sfn "${REAL%/}" linux-x86_64
          ln -sfn "${REAL%/}" linux-x86
          ls -la

          mkdir -p "$GITHUB_WORKSPACE/build" && cd "$GITHUB_WORKSPACE/build"
          cmake -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android \
            -DCMAKE_CXX_FLAGS="-static-libstdc++" \
            -DLLVM_ENABLE_PROJECTS="llvm;clang;lld;lldb;compiler-rt;clang-tools-extra" \
            -DLLVM_ENABLE_RUNTIMES="libunwind" \
            -DLLVM_BUILD_RUNTIME=ON \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_EH=ON \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DLLVM_DISTRIBUTION_COMPONENTS="clang;clang-resource-headers;opt;lld;lldb;clang-format" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_EXTERNAL_PROJECTS=Obfuscator \
            -DLLVM_EXTERNAL_OBFUSCATOR_SOURCE_DIR="$GITHUB_WORKSPACE/xollvm" \
            -DLLVM_OBFUSCATOR_LINK_INTO_TOOLS=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            ../llvm-src/llvm
            
      - name: 编译
        shell: bash
        run: |
          # 只编 builtins（三架构）+ libunwind；sanitizer 不碰（鸡生蛋 + 用不上）
          cmake --build build --parallel 4 --target \
            clang_rt.builtins-aarch64-android \
            clang_rt.builtins-x86_64-android \
            clang_rt.builtins-arm-android \
            runtimes
          # 再正常出发行产物
          cmake --build build --parallel 4 --target install-distribution

      - name: 兜底：运行时库 + 头文件一并放进安装树
        shell: bash
        run: |
          # 1. 按架构分类拷贝 builtins（aarch64 / x86_64 / arm）
          for f in $(find build -name "libclang_rt.builtins*.a"); do
            case "$f" in
              *aarch64*) D=aarch64-unknown-linux-android24 ;;
              *x86_64*)  D=x86_64-unknown-linux-android24 ;;
              *arm*android*) D=armv7-unknown-linux-androideabi24 ;;
              *) echo "跳过未知架构: $f"; continue ;;
            esac
            mkdir -p "install/lib/clang/23/lib/$D"
            cp "$f" "install/lib/clang/23/lib/$D/libclang_rt.builtins.a"
            echo "builtins($D) <- $f"
          done

          # 2. libunwind 同样按架构
          for f in $(find build -name "libunwind*.a"); do
            case "$f" in
              *aarch64*) D=aarch64-unknown-linux-android24 ;;
              *x86_64*)  D=x86_64-unknown-linux-android24 ;;
              *arm*)     D=armv7-unknown-linux-androideabi24 ;;
              *) D=aarch64-unknown-linux-android24 ;;
            esac
            mkdir -p "install/lib/clang/23/lib/$D"
            cp "$f" "install/lib/clang/23/lib/$D/libunwind.a"
            echo "unwind($D) <- $f"
          done

          # 3. 头文件
          for h in unwind.h libunwind.h __libunwind_config.h; do
            SRC=$(find build llvm-src/libunwind/include -name "$h" 2>/dev/null | head -n1)
            if [ -n "$SRC" ]; then cp "$SRC" install/lib/clang/23/include/; echo "头 $h <- $SRC"; fi
          done

          echo "=== 对账 ==="
          find install/lib/clang/23/lib -type f

      - name: 验证产物（交叉编译无法本机执行，只验 ELF 身份）
        run: |
          file install/bin/clang
          readelf -h install/bin/clang | grep -E "Class|Machine|interpreter" || true
          # 期望看到: ELF 64-bit / ARM aarch64 / interpreter /system/bin/linker64

      - name: 打包
        run: |
          cd install
          tar --zstd -cf ../xollvm-android-aarch64-llvm${{ inputs.llvm_major }}-Release.tar.zst .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: xollvm-android-aarch64-llvm${{ inputs.llvm_major }}
          path: xollvm-android-aarch64-llvm${{ inputs.llvm_major }}-Release.tar.zst
          retention-days: 14
          if-no-files-found: error
